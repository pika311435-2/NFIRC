<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相關連結</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #121212;
            color: #fff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        nav {
            background-color: rgba(30, 30, 30, 0.9);
            overflow: hidden;
            padding: 16px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-logo {
            height: 50px;
            width: 50px;
            margin-right: 15px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(100, 65, 165, 0.7);
        }

        .nav-nfirc {
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px #6441A5;
            transition: color 0.3s;
            color: white;
            margin-right: 20px; /* Add some spacing after NFIRC text */
        }

        .nav-nfirc:hover {
            color: #6441A5;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
        }

        .menu-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: #fff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }

        .nav-btns {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-btns a {
            display: inline-block;
            color: #f2f2f2;
            text-align: center;
            padding: 10px 14px;
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
            border-radius: 5px;
            margin: 0;
            background-color: rgba(100, 65, 165, 0.3);
            border: 1px solid #6441A5;
            white-space: nowrap;
        }

        .nav-btns a:hover {
            background-color: #6441A5;
            color: white;
        }

        /* Add a class for the rightmost button */
        .nav-btns a:last-child {
            margin-right: 40px; /* Remove right margin from the last button */
        }

        .container {
            padding: clamp(120px, 24vw, 180px) 16px 40px;
            text-align: center;
            max-width: 1120px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin-bottom: 24px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            grid-gap: 20px;
            max-width: 980px;
            margin: 20px auto;
        }

        .grid-item {
            background-color: rgba(30, 30, 30, 0.8);
            border: 1px solid #6441A5;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            min-height: 110px;
            overflow: hidden;
        }

        .grid-item a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 6px;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .background-animation span {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(100, 65, 165, 0.6);
            animation: animate 6s linear infinite;
            bottom: -150px;
            border-radius: 50%;
            opacity: 0;
        }

        .background-animation span:nth-child(even) {
            background: rgba(69, 42, 122, 0.6);
        }

        .background-animation span:nth-child(3n+1) {
            left: 15%;
            width: 60px;
            height: 60px;
            animation-delay: 1s;
        }

        .background-animation span:nth-child(3n+2) {
            left: 45%;
            width: 80px;
            height: 80px;
            animation-delay: 2s;
        }

        .background-animation span:nth-child(3n+3) {
            left: 75%;
            width: 50px;
            height: 50px;
            animation-delay: 3s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-900px) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 14px 16px;
            }

            .nav-left {
                width: 100%;
                justify-content: center;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-btns {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding-top: 8px;
            }

            .nav-btns.show {
                display: flex;
            }

            .nav-btns a {
                width: 100%;
                font-size: 0.9em;
                padding: 10px 12px;
            }

            .nav-btns a:last-child {
                margin-right: 0;
            }

            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                max-width: 100%;
            }

            .grid-item {
                min-height: 90px;
            }
        }

        @media (max-width: 480px) {
            .nav-btns a {
                width: calc(50% - 8px);
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .grid-item {
                width: 100%;
            }

            footer {
                padding: 16px;
            }
        }

        footer {
            background-color: rgba(30, 30, 30, 0.9);
            padding: 10px 0;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        footer p {
            margin: 0;
            color: #f2f2f2;
        }

        footer img {
            max-width: 100%;
            height: auto;
        }

        #scrollToTopBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color:  rgba(100, 65, 165, 0.3);
            color: #f2f2f2;
            border: 1px solid #6441A5;
            border-radius: 5px;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: background-color 0.3s, transform 0.2s, color 0.3s;
            z-index: 1000; /* Ensure it's above the footer */
        }

        #scrollToTopBtn:hover {
            background-color: #6441A5;
            color: white;
            transform: translateY(-2px);
        }

        /* Hamburger menu styles */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 25px;
            cursor: pointer;
            margin-left: auto;
        }

        .bar {
            height: 3px;
            width: 100%;
            background-color: #6441A5;
            transition: all 0.3s;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            margin-left: 20px;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .nav-btns {
                /*flex-direction: column;  Stack buttons on smaller screens */
                align-items: center; /* Make buttons horizontally align */
                display: flex;
            }

            .nav-btns a {
                margin-left: 0; /* Remove left margin */
                margin-top: 10px; /* Add some spacing between buttons */
                flex-shrink: 1; /* Allow buttons to shrink */
                font-size: 0.9em; /* Reduce font size */
                padding: 10px 15px;
            }

            .nav-btns a:last-child {
                margin-right: 0; /* Ensure no right margin on the last button */
                margin-bottom: 0;
            }
        }
    </style>

    <button id="scrollToTopBtn" title="Go to top">回到頂端⭡</button>

    <script>
        const titleElement = document.getElementById('title');
        const titleText = titleElement.textContent;
        titleElement.textContent = '';

        let charIndex = 0;
        const typingDelay = 50;

        function typeTitle() {
            if (charIndex < titleText.length) {
                titleElement.textContent += titleText.charAt(charIndex);
                charIndex++;
                setTimeout(typeTitle, typingDelay);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            typeTitle();
        });

        // Scroll to top button functionality
        const scrollToTopBtn = document.getElementById("scrollToTopBtn");

        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                scrollToTopBtn.style.display = "block";
            } else {
                scrollToTopBtn.style.display = "none";
            }
        }

        scrollToTopBtn.addEventListener('click', () => {
            document.body.scrollTop = 0; // For Safari
            document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
        });

        const menuToggle = document.querySelector('.menu-toggle');
        const navBtns = document.querySelector('.nav-btns');

        if (menuToggle && navBtns) {
            menuToggle.addEventListener('click', () => {
                navBtns.classList.toggle('show');
                menuToggle.classList.toggle('active');
                const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', String(!expanded));
            });
        }
    </script>
